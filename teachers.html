<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="students-page">

    <h1>👩‍🏫 Teacher Management</h1>
    <p>School teacher information</p>

    <button class="add-btn" onclick="showTeacherForm()">
        ➕ Add Teacher
    </button>

    <!-- Add Teacher Form -->
    <div id="teacherForm" class="student-form hidden">

        <h2>Add New Teacher</h2>

        <input type="text" id="teacherName" placeholder="Teacher Name">

        <input type="text" id="subject" placeholder="Subject">

        <input type="email" id="teacherEmail" placeholder="Email">

        <input type="text" id="teacherMobile" placeholder="Mobile Number">

        <button onclick="addTeacher()">Save Teacher</button>

        <button class="cancel-btn" onclick="hideTeacherForm()">
            Cancel
        </button>

    </div>


    <!-- Teacher List -->
    <div class="table-box">

        <h2>Teacher List</h2>

        <table>

            <thead>
                <tr>
                    <th>No.</th>
                    <th>Teacher Name</th>
                    <th>Subject</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="teacherTable"></tbody>

        </table>

        <p id="noTeachers">No teachers available.</p>

    </div>


    <button class="back-btn" onclick="goDashboard()">
        ← Back to Dashboard
    </button>

</div>


<script>

let teachers = JSON.parse(localStorage.getItem("teachers")) || [];

displayTeachers();


function showTeacherForm() {
    document.getElementById("teacherForm").classList.remove("hidden");
}


function hideTeacherForm() {
    document.getElementById("teacherForm").classList.add("hidden");
}


function addTeacher() {

    let name = document.getElementById("teacherName").value;
    let subject = document.getElementById("subject").value;
    let email = document.getElementById("teacherEmail").value;
    let mobile = document.getElementById("teacherMobile").value;

    if (name === "" || subject === "" || email === "" || mobile === "") {
        alert("Please fill all details.");
        return;
    }

    let teacher = {
        name: name,
        subject: subject,
        email: email,
        mobile: mobile
    };

    teachers.push(teacher);

    localStorage.setItem("teachers", JSON.stringify(teachers));

    alert("Teacher added successfully!");

    document.getElementById("teacherName").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("teacherEmail").value = "";
    document.getElementById("teacherMobile").value = "";

    hideTeacherForm();

    displayTeachers();
}


function displayTeachers() {

    let table = document.getElementById("teacherTable");
    let noTeachers = document.getElementById("noTeachers");

    table.innerHTML = "";

    if (teachers.length === 0) {

        noTeachers.style.display = "block";

    } else {

        noTeachers.style.display = "none";

        teachers.forEach((teacher, index) => {

            let row = document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${teacher.name}</td>
                <td>${teacher.subject}</td>
                <td>${teacher.email}</td>
                <td>${
