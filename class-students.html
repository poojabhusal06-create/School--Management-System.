<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="students-page">

    <h1>👨‍🎓 Student Management</h1>

    <p id="classTitle"></p>


    <!-- Add Student Button -->

    <button class="add-btn" onclick="showForm()">
        ➕ Add Student
    </button>


    <!-- Student Form -->

    <div id="studentForm" class="student-form hidden">

        <h2>Add New Student</h2>

        <input type="text" id="name" placeholder="Student Name">

        <input type="text" id="roll" placeholder="Roll Number">

        <input type="email" id="email" placeholder="Email">

        <input type="text" id="mobile" placeholder="Mobile Number">

        <select id="gender">

            <option value="">Select Gender</option>

            <option>Male</option>

            <option>Female</option>

            <option>Other</option>

        </select>


        <input type="date" id="dob">


        <input type="text" id="parent" placeholder="Parent Name">


        <input type="text" id="address" placeholder="Address">


        <button onclick="addStudent()">
            Save Student
        </button>


        <button class="cancel-btn" onclick="hideForm()">
            Cancel
        </button>

    </div>


    <!-- Student Table -->

    <div class="table-box">

        <h2>Student List</h2>

        <table>

            <thead>

                <tr>

                    <th>Roll No</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Mobile</th>

                    <th>Class</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="studentTable">

            </tbody>

        </table>


        <p id="noStudents">
            No students available.
        </p>

    </div>


    <button class="back-btn" onclick="goBack()">
        ← Back to Classes
    </button>

</div>


<script>

// Selected Class

let selectedClass =
    localStorage.getItem("selectedClass");


// Show class name

document.getElementById("classTitle").innerText =
    "Class: " + (selectedClass || "All Students");


// Backend URL

const API_URL =
    "http://localhost:5000/api/students";


// Show form

function showForm() {

    document
        .getElementById("studentForm")
        .classList
        .remove("hidden");

}


// Hide form

function hideForm() {

    document
        .getElementById("studentForm")
        .classList
        .add("hidden");

}
